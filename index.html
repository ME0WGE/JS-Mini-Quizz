<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
      integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
      crossorigin="anonymous"
      defer
    ></script>
    <script src="./public/js/main.js" defer></script>
    <title>Quizz</title>
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <div class="bg-dark text-secondary px-4 py-5 text-center">
        <div class="py-5">
          <h1 class="display-5 fw-bold text-white title">Dark color hero</h1>
          <div class="col-lg-6 mx-auto">
            <p class="fs-5 mb-4">Incroyable Quizz sur les Pays!</p>
          </div>
        </div>
      </div>
    </header>
    <!-- CONTENT -->
    <div>
      <div class="card text-center w-50">
        <div class="card-header fw-bold fs-4">QUESTIONS</div>
        <div class="card-body">
          <h5 class="card-title">
            Question: Lorem ipsum dolor, sit amet consectetur adipisicing elit.
            Magni, dicta beatae enim ad aut ipsam?
          </h5>
          <p class="card-text">
            Options: Lorem ipsum, dolor sit amet consectetur adipisicing elit.
            Necessitatibus, sed.
          </p>
          <button type="button" class="btn btn-primary">Primary</button>
          <button type="button" class="btn btn-primary">Primary</button>
          <button type="button" class="btn btn-primary">Primary</button>
          <button type="button" class="btn btn-primary">Primary</button>
        </div>
        <div class="card-footer text-body-secondary">Question x</div>
      </div>
    </div>
    <!-- SCORE -->
    <div>
      <div class="card w-25">
        <div class="card-header fw-bold fs-4">SCORE</div>
        <div class="card-body">
          <blockquote class="blockquote mb-0">
            <p>x Points</p>
          </blockquote>
        </div>
      </div>
    </div>
  </body>
</html>
